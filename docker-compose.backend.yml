# SULCO — Standalone Backend Container (Produção / Cloud / VPS)
# Uso:
#   docker compose -f docker-compose.backend.yml up --build -d
#
# Para conferir saúde:
#   curl http://localhost:8000/saude

services:
  api:
    image: sulco-backend:latest
    build:
      context: .
      target: final
      args:
        WITH_RAG: "1"        # 0 = sem torch (RAG só BM25, imagem menor <800MB)
    container_name: sulco-backend
    init: true               # encerra processos filhos com PID 1 limpo
    restart: unless-stopped
    read_only: true          # sistema de arquivos raiz em modo somente leitura
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      HOME: /tmp
      API_PORT: "8000"
      SULCO_LLM_MODO: ${SULCO_LLM_MODO:-online}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-30}
      SULCO_CORS_ORIGINS: ${SULCO_CORS_ORIGINS:-*}
      SULCO_CHAT_CACHE_DIR: /app/data/processed/llm_cache/chat
    volumes:
      - sulco_modelos:/app/data/processed/modelos      # cache do modelo de previsão
      - sulco_llm:/app/data/processed/llm_cache        # cache das respostas do LLM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 90s     # a API pré-aquece o RAG (~22 s) e o modelo preditivo (~10 s) ao subir
      retries: 3
    deploy:
      resources:
        limits:
          memory: 3g        # medido: ~2,0 GB (pico 2,2 GB) com RAG semântico aquecido

volumes:
  sulco_modelos:
  sulco_llm:
