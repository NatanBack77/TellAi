# Configuração do módulo src/modelos/ (SULCO)
semente: 42

caminhos:
  clima: data/processed/clima_diario.parquet
  ndvi: data/processed/ndvi_16d.parquet
  umidade_solo: data/processed/umidade_solo.parquet   # opcional
  saida: data/processed/modelos

# Colunas obrigatórias por arquivo (falta => parar e pedir)
colunas_obrigatorias:
  clima: [ponto_id, celula_power, data, chuva_mm, tmax_c, tmin_c, radiacao]
  ndvi: [ponto_id, data, ndvi, confiabilidade]
  umidade_solo: [ponto_id, data, sm_superficie, sm_raiz]

ndvi:
  observacoes_por_ano: 23
  # PROVISÓRIO: valores de "pixel reliability" do MOD13Q1 aceitos. Confirmar na doc oficial.
  confiabilidade_aceita: [0, 1]
  max_interpolacao_consecutiva: 2   # observações seguidas que podem ser interpoladas
  min_obs_ano_valido: 16            # observações válidas (de 23) para o ano contar
  stl_robusto: true

solo_nu:
  metodo: percentil          # percentil | fixo
  percentil: 20
  limiar_fixo: null          # usado se metodo = fixo

veranico:
  limiar_chuva_mm: 1.0

estacao_chuvosa:
  n_quinzenas: 8             # quinzenas mais chuvosas da climatologia do ponto

cobertura_minima_dados: 0.9   # fração de dias presentes para aceitar um período (quinzena/ano/estação)

confianca:
  anos_alta: 15       # heurística de cobertura de dados, NÃO é probabilidade
  anos_media: 8

tendencia:
  min_anos: 10               # abaixo disso => lacuna explícita

preditivo:
  janelas_chuva_dias: [30, 60, 90]
  janela_tmax_dias: 30
  janela_umidade_dias: 15          # média da umidade nos 15 dias ANTES do período t
  min_anos_climatologia_slot: 3    # anos de referência por slot para calcular a anomalia
  holdout_anos: 3
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]   # escolhido por validação interna agrupada, só com dados de treino
  xgboost:                                # fixos a priori; NUNCA ajustados olhando o teste
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
  min_linhas_treino: 50
  n_folds: 5
  cobertura_alvos: [0.8, 0.9]
  conformal_fracao_calibracao: 0.25   # fração das CÉLULAS do treino reservada à calibração
  min_celulas_aviso: 15
  # D52: persistência = anomalia dos 2 compostos anteriores (validada em walk-forward, D41). Padrão: ligada.
  # false => modelo só-clima (comportamento anterior), mantido como opção e como linha de comparação no relatório.
  usar_persistencia: true
  persistencia_max_gap_dias: 17     # compostos só contam como consecutivos se separados por <= 17 dias
  # D52: SMAP desligado por padrão (ganho ~+0,007 sobre a persistência, poder baixo, perde ~60% das linhas por começar em 2015).
  usar_umidade_solo: false

# Coleta (src/coleta). PONTOS = PROPOSTA a revisar (S2): semiárido do Nordeste, uma célula POWER por ponto.
coleta:
  power:
    inicio: 20010101
    fim: 20241231
    comunidade: AG
    # nomes e unidades confirmados na resposta da API em 2026-11-11 (header.parameters); fill_value = -999
    parametros: {chuva_mm: PRECTOTCORR, tmax_c: T2M_MAX, tmin_c: T2M_MIN, radiacao: ALLSKY_SFC_SW_DWN}
    pasta_bruta: data/raw/power
    grade_lat: 0.5
    grade_lon: 0.625
  # SMAP L4 (SPL4SMGP v008, 9 km, 3-hourly). Variáveis/unidades conferidas nos atributos do arquivo HDF5 (2026-11-11):
  # Geophysical_Data/sm_surface (0-5 cm) e sm_rootzone (0-100 cm), m3 m-3, _FillValue -9999.
  smap:
    short_name: SPL4SMGP
    versao: "008"
    inicio: 20150331
    fim: 20241231
    pasta_bruta: data/raw/smap
    var_superficie: sm_surface
    var_raiz: sm_rootzone
    fill: -9999.0
    min_granulos_dia: 6        # de 8 granulos de 3 h por dia (UTC); abaixo disso o dia vira NaN
    workers: 16
  pontos:
