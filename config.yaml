# Walk-forward (src/modelos/walkforward.py): 1 ano à frente, treino = anos anteriores
walkforward:
  min_anos_treino: 8
  anos_selecao: [2010, 2021]       # decidem quais variantes seguem
  anos_confirmacao: [2022, 2024]   # SELADOS: só olhar no fim, uma vez
